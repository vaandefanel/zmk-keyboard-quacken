# This file describes the keymaps that will be built by the GitHub Actions CI.

include:

  # Quacken Zero + SparkFun RP2040
  # CONFIG_ZMK_POINTING : molette simulée de la couche navigation (&msc)
  - board: sparkfun_pro_micro_rp2040//zmk
    shield: quacken_zero
    artifact-name: quacken_zero
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_POINTING=y
